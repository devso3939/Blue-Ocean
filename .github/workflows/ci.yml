name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Syntax check all modules
        working-directory: backend
        run: python -m compileall -q app

      - name: Unit tests (offline)
        working-directory: backend
        run: |
          python test_learning.py
          python test_jobstore.py
          python test_jobmanager.py

      - name: App imports cleanly
        working-directory: backend
        run: python -c "from app import main; print('backend imports OK')"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        run: npm run build

      - name: Bundle parser-test harness
        working-directory: client
        # Diagnostic capture: job logs need admin rights to read, so on
        # failure the tail of esbuild's output is surfaced as an annotation.
        # Exit status is preserved verbatim — this never masks a failure.
        run: |
          set +e
          OUT=$(node node_modules/esbuild/bin/esbuild src/__parsertest.ts --bundle --platform=node --format=cjs --outfile=parsertest.cjs 2>&1)
          EC=$?
          if [ "$EC" -ne 0 ]; then
            MSG=$(printf '%s' "$OUT" | tr '\n' ' ' | tail -c 1400)
            echo "::error title=Bundle parser-test harness failed (exit $EC)::$MSG"
          fi
          exit $EC

      - name: Extraction fixtures (offline parser gate)
        working-directory: client
        env:
          SMOKE_ONLY: "1"
        run: node extract_fixtures.cjs

      - name: Extraction smoke — basic contacts
        working-directory: client
        env:
          SMOKE_ONLY: "1"
        run: node smoke_extract.cjs

      - name: Extraction smoke — obfuscation patterns
        working-directory: client
        env:
          SMOKE_ONLY: "1"
        run: node smoke_extract2.cjs
