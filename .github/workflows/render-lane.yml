# Blue Ocean - render lane (Cloudflare-challenged site fetcher)
#
# Renders a URL in a REAL headless Chromium on GitHub's free public-repo
# runners so Cloudflare's JS challenge is defeated. The rendered DOM is
# committed to the `render-cache` branch:
#
#   dom/<sha1(url)>.html
#   meta/<sha1(url)>.json
#
# Dispatch flow (client/Supabase layer):
#   1. POST repository_dispatch (type: render-lane) with client_payload.url
#   2. poll raw meta/<sha>.json until status == "done"
#   3. fetch raw dom/<sha>.html
#
# Entries older than 7 days are re-rendered on demand.

name: render-lane

on:
  repository_dispatch:
    types: [render-lane]
  workflow_dispatch:
    inputs:
      url:
        description: "URL to render (https only)"
        required: true

permissions:
  contents: write

concurrency:
  group: render-lane
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out scripts
        uses: actions/checkout@v4

      - name: Resolve target URL
        id: target
        env:
          DISPATCH_URL: ${{ github.event.client_payload.url }}
          INPUT_URL: ${{ github.event.inputs.url }}
        run: |
          U="${DISPATCH_URL:-$INPUT_URL}"
          if [ -z "$U" ]; then echo "No URL provided"; exit 1; fi
          case "$U" in
            https://*) ;;
            *) echo "Only https URLs allowed"; exit 1 ;;
          esac
          SHA=$(printf '%s' "$U" | sha1sum | cut -d' ' -f1)
          echo "url=$U" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Serve from cache if younger than 7 days
        id: cache
        run: |
          SHA="${{ steps.target.outputs.sha }}"
          META_URL="https://raw.githubusercontent.com/${{ github.repository }}/render-cache/meta/${SHA}.json"
          HTTP=$(curl -s -o /tmp/old_meta.json -w "%{http_code}" --max-time 15 "$META_URL" || echo 000)
          FRESH=no
          if [ "$HTTP" = "200" ]; then
            FRESH=$(python3 -c "import json,datetime,pathlib;m=json.loads(pathlib.Path('/tmp/old_meta.json').read_text());ts=datetime.datetime.fromisoformat(m['finished_at'].replace('Z','+00:00'));print('yes' if datetime.datetime.now(datetime.timezone.utc)-ts < datetime.timedelta(days=7) and m.get('status')=='done' else 'no')" 2>/dev/null || echo no)
          fi
          echo "fresh=$FRESH" >> "$GITHUB_OUTPUT"

      - name: Install Playwright + Chromium
        if: steps.cache.outputs.fresh != 'yes'
        run: |
          pip install playwright==1.49.1
          playwright install chromium --with-deps

      - name: Render URL in headless Chromium
        if: steps.cache.outputs.fresh != 'yes'
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
        run: python scripts/render_lane.py

      - name: Commit rendered DOM to render-cache branch
        if: steps.cache.outputs.fresh != 'yes'
        env:
          SHA: ${{ steps.target.outputs.sha }}
          URL: ${{ steps.target.outputs.url }}
        run: |
          git config --global user.name  "render-lane bot"
          git config --global user.email "render-lane@users.noreply.github.com"
          TOK="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if ! git ls-remote --exit-code --heads "$TOK" render-cache >/dev/null 2>&1; then
            git clone --depth 1 "$TOK" rc
            cd rc
            git checkout --orphan render-cache
            git rm -rf . 2>/dev/null || true
            mkdir -p dom meta
            echo "# render-cache: rendered DOMs keyed by sha1(url)" > README.md
            git add -A
            git commit -m "init render-cache"
            git push origin render-cache
            cd ..
            rm -rf rc
          fi
          git clone --depth 1 --branch render-cache "$TOK" rc
          cd rc
          mkdir -p dom meta
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq --arg u "$URL" --arg t "$NOW" '. + {url:$u, status:"done", finished_at:$t}' /tmp/meta.json > meta/${SHA}.json
          cp /tmp/dom.html dom/${SHA}.html
          git add -A
          git commit -m "render: ${URL}" || echo "Nothing to commit (identical DOM)"
          git push origin render-cache

      - name: Cache hit
        if: steps.cache.outputs.fresh == 'yes'
        run: echo "Fresh render already in cache - served without re-rendering."
