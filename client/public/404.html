<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blue Ocean</title>
<script>
/*
 * SPA fallback for GitHub Pages (v6.9.121).
 *
 * Pages serves static files only, so deep links like /Blue-Ocean/admin hit
 * this 404 page. Boot the SPA entry while passing the ORIGINAL path through
 * the ?__route= param — main.tsx consumes it, renders the right view, and
 * restores the clean URL. The reload-once guard prevents a loop if the SPA
 * itself 404s again (main.tsx clears it once the app is actually running).
 */
(function () {
  if (sessionStorage.getItem('bo_404_reload') === '1') return; // loop guard
  sessionStorage.setItem('bo_404_reload', '1');
  // v6.9.122: normalize a trailing slash FIRST — for /Blue-Ocean/admin/ the
  // naive base would keep /admin/ and look for admin/index.html (missing →
  // second 404 → stuck on this page).
  var clean = location.pathname.replace(/\/+$/, '');
  var base = clean.replace(/[^/]*$/, '') + '/';
  var route = clean + (location.search || '');
  location.replace(base + 'index.html?__route=' + encodeURIComponent(route) + location.hash);
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=/"></noscript>
</head>
<body style="font-family: system-ui, sans-serif; background:#0b1d33; color:#e8f0fa;">
Loading Blue Ocean…
</body>
</html>
